# ==============================================================
# Jerney - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
# Target: Azure AKS + GitHub Container Registry GHCR
# Stages: Lint → Secrets Scan → SCA → Dockerfile Lint → IaC Scan → SAST → Build/Image Scan/Push → DAST → Deploy Manifest Update
# ==============================================================

name: Jerney DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - azure-aks
  pull_request:
    branches:
      - main
      - azure-aks
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  # ==============================================================
  # STAGE 1: Linting
  # ==============================================================
  lint:
    name: "Lint ${{ matrix.component }}"
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        run: npm run lint

  # ==============================================================
  # STAGE 2: Secrets Scanning - Gitleaks
  # ==============================================================
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full git history, not just the latest commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================
  # STAGE 3: Software Composition Analysis - npm audit
  # ==============================================================
  sca:
    name: "Dependency Audit ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --omit=dev --audit-level=high

  # ==============================================================
  # STAGE 4: Dockerfile Lint - Hadolint
  # ==============================================================
  dockerfile-lint:
    name: "Dockerfile Lint ${{ matrix.component }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  # ==============================================================
  # STAGE 5: IaC Security Scan - Checkov
  # ==============================================================
  iac-scan:
    name: "IaC Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Azure Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
          output_format: cli

  # ==============================================================
  # STAGE 6: SAST - SonarCloud
  # ==============================================================
  sast-sonarcloud:
    name: "SAST - SonarCloud"
    runs-on: ubuntu-latest
    needs: lint
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for accurate SonarCloud analysis 

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ==============================================================
  # STAGE 7: Build, Scan and Push Docker Images to GHCR
  # ==============================================================
  build-scan-push:
    name: "Build, Scan and Push ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sca
      - dockerfile-lint
      - iac-scan
      - sast-sonarcloud

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/jerney-${{ matrix.component }}"
          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }} \
            -t ${{ steps.vars.outputs.image_name }}:latest \
            ./${{ matrix.component }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          timeout: "10m"

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ steps.vars.outputs.image_name }}:latest

  # ==============================================================
  # STAGE 8: DAST - OWASP ZAP Baseline Scan
  # ==============================================================
  dast-zap:
    name: "DAST - OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan-push

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for application to be ready
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -sf http://localhost > /dev/null; then
              echo "Application is up."
              exit 0
            fi
            echo "Waiting for app... ($i/20)"
            sleep 5
          done

          echo "Application did not become ready in time."
          docker compose ps
          docker compose logs
          exit 1

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run OWASP ZAP Baseline Scan
        shell: bash
        run: |
          docker run --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://localhost \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            zap-reports/zap-report.html
            zap-reports/zap-report.json
            zap-reports/zap-report.md

      - name: Stop application stack
        if: always()
        run: docker compose down
        

  # ==============================================================
  # STAGE 9: Update Kubernetes Manifest with New Image Tag
  # ==============================================================
  update-manifest:
    name: "Update Kubernetes Manifest"
    runs-on: ubuntu-latest
    needs:
      - build-scan-push
      - dast-zap

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update K8s manifest with new image tags
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=$(git rev-parse --short HEAD)

          BACKEND_IMAGE="ghcr.io/${OWNER}/jerney-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER}/jerney-frontend"

          echo "Backend image: ${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Frontend image: ${FRONTEND_IMAGE}:${IMAGE_TAG}"

          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)

          echo "Backend image line: ${BACKEND_LINE}"
          echo "Frontend image line: ${FRONTEND_LINE}"

          if [ -z "$BACKEND_LINE" ]; then
            echo "Backend image line not found in k8s/jerney.yaml"
            exit 1
          fi

          if [ -z "$FRONTEND_LINE" ]; then
            echo "Frontend image line not found in k8s/jerney.yaml"
            exit 1
          fi

          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          echo "Updated images:"
          grep -n "image:" k8s/jerney.yaml

      - name: Commit and push manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/jerney.yaml

          if git diff --cached --quiet; then
            echo "No manifest change to commit."
          else
            git commit -m "ci: update k8s images to $(git rev-parse --short HEAD) [skip ci]"
            git push
          fi

 # ==============================================================
 # STAGE 10: AKS Deployment
 # ==============================================================
  deploy-aks:
    name: Deploy to Azure AKS
    runs-on: ubuntu-latest
    needs: update-manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/azure-aks'

    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v6
        with:
          ref: azure-aks
          fetch-depth: 0

      - name: Pull latest manifest update
        run: git pull origin azure-aks

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group rg-jerney-devsecops --name aks-jerney --overwrite-existing --admin

      - name: Deploy Kubernetes manifests
        run: kubectl apply -f k8s/jerney.yaml

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/jerney-db -n jerney --timeout=180s
          kubectl rollout status deployment/jerney-backend -n jerney --timeout=180s
          kubectl rollout status deployment/jerney-frontend -n jerney --timeout=180s
          kubectl get pods -n jerney
          kubectl get svc -n jerney