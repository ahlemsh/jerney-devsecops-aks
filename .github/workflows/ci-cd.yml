# ==============================================================
# Jerney - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
# Target: Azure AKS + GitHub Container Registry GHCR
# Stages: Lint → Secrets Scan → SCA → Dockerfile Lint → IaC Scan → SAST → Build/Image Scan/Push → DAST → Deploy Manifest Update
# ==============================================================

name: Jerney DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - azure-aks
  pull_request:
    branches:
      - main
      - azure-aks
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  # ==============================================================
  # STAGE 1: Linting
  # ==============================================================
  lint:
    name: "Lint ${{ matrix.component }}"
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        run: npm run lint

  # ==============================================================
  # STAGE 2: Secrets Scanning - Gitleaks
  # ==============================================================
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full git history, not just the latest commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================
  # STAGE 3: Software Composition Analysis - npm audit
  # ==============================================================
  sca:
    name: "Dependency Audit ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high

  # ==============================================================
  # STAGE 4: Dockerfile Lint - Hadolint
  # ==============================================================
  dockerfile-lint:
    name: "Dockerfile Lint ${{ matrix.component }}"
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  # ==============================================================
  # STAGE 5: IaC Security Scan - Checkov
  # ==============================================================
  iac-scan:
    name: "IaC Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Azure Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
          output_format: cli

  # ==============================================================
  # STAGE 6: SAST - SonarCloud
  # ==============================================================
  sast-sonarcloud:
    name: "SAST - SonarCloud"
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for accurate SonarCloud analysis (blame/history)

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==============================================================
  # STAGE 7: Build, Scan and Push Docker Images to GHCR
  # ==============================================================
  build-scan-push:
    name: "Build, Scan and Push ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sca
      - dockerfile-lint
      - iac-scan
      - sast-sonarcloud

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/jerney-${{ matrix.component }}"
          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }} \
            -t ${{ steps.vars.outputs.image_name }}:latest \
            ./${{ matrix.component }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ steps.vars.outputs.image_name }}:latest

  # ==============================================================
  # STAGE 8: DAST - OWASP ZAP Baseline Scan
  # ==============================================================
  dast-zap:
    name: "DAST - OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan-push
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for application to be ready
        shell: bash
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost > /dev/null; then
              echo "Application is up."
              break
            fi
            echo "Waiting for app... ($i/15)"
            sleep 5
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost"
          fail_action: false

      - name: Stop application stack
        if: always()
        run: docker compose down

  # ==============================================================
  # STAGE 9: Update Kubernetes Manifest with New Image Tag
  # ==============================================================
  update-manifest:
    name: "Update Kubernetes Manifest"
    runs-on: ubuntu-latest
    needs:
      - build-scan-push
      - dast-zap

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update K8s manifest with new image tags
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=$(git rev-parse --short HEAD)

          BACKEND_IMAGE="ghcr.io/${OWNER}/jerney-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER}/jerney-frontend"

          echo "Backend image: ${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Frontend image: ${FRONTEND_IMAGE}:${IMAGE_TAG}"

          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)

          echo "Backend image line: ${BACKEND_LINE}"
          echo "Frontend image line: ${FRONTEND_LINE}"

          if [ -z "$BACKEND_LINE" ]; then
            echo "Backend image line not found in k8s/jerney.yaml"
            exit 1
          fi

          if [ -z "$FRONTEND_LINE" ]; then
            echo "Frontend image line not found in k8s/jerney.yaml"
            exit 1
          fi

          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          echo "Updated images:"
          grep -n "image:" k8s/jerney.yaml

      - name: Commit and push manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/jerney.yaml

          if git diff --cached --quiet; then
            echo "No manifest change to commit."
          else
            git commit -m "ci: update k8s images to $(git rev-parse --short HEAD) [skip ci]"
            git push
          fi